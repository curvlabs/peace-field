<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peace Field</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" id="container">
        <img src="assets/FLORA Image.webp" alt="" class="back-image" id="backImage">
    </div>

    <div class="voice-bar" id="voiceBar">
        <svg class="voice-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12H6M8 8V16M12 4V20M16 8V16M20 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="voice-bar-text" id="voiceBarText">How have you tried to heal your back so far?</span>
    </div>

    <div class="care-plan-overlay" id="carePlanOverlay">
        <h2 class="plan-heading">Here's your care plan:</h2>
        <div class="cards-track" id="cardsTrack"></div>
        <button class="dismiss-plan" id="dismissPlan">×</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
