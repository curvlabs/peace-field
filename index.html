<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peace Field</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" id="container">
        <video id="introVideo" src="assets/Curv_trimmed_video.mp4" muted playsinline autoplay></video>
        <canvas id="backCanvas"></canvas>
    </div>


    <div class="care-plan-overlay" id="carePlanOverlay">
        <h2 class="plan-heading">Here's your care plan:</h2>
        <div class="cards-track" id="cardsTrack"></div>
        <button class="dismiss-plan" id="dismissPlan">×</button>
    </div>

    <div class="hurt-prompt">
        <span>Where does your</span>
        <span>back hurt?</span>
    </div>

    <!-- Form Modal Overlay -->
    <div class="form-modal-overlay" id="formModal">
        <div class="form-modal-content">
            <button class="form-modal-close" id="formModalClose">×</button>
            <div id="formflow-embed" data-form-id="62934820-d2a1-4880-b539-d2c27b137f61"></div>
        </div>
    </div>

    <script src="https://myformflow.io/embed/widget.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
